name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish tags
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # A stable asset name matters: the install page and the /apk short link both look for
      # a file ending in .apk, and a predictable name keeps direct links working.
      - name: Name the artifact
        id: artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="candidate-${GITHUB_RUN_NUMBER}"
          fi
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SOURCE" ]; then
            echo "::error::No APK was produced by assembleRelease"
            exit 1
          fi
          mkdir -p dist
          cp "$SOURCE" "dist/opentv-mobile-${TAG}.apk"
          cp "$SOURCE" "dist/opentv-mobile.apk"
          echo "path=dist/opentv-mobile-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Upload signed candidate APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: opentv-mobile-signed-candidate
          path: dist/*.apk
          if-no-files-found: error

      - name: Release notes from CHANGELOG
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ ("^## " v "([^0-9]|$)"){f=1;next} /^## /{f=0} f{print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See the changelog for what is new in this release." > release-notes.md; fi
          {
            echo ""
            echo "---"
            echo "Built by GitHub Actions from the tagged commit — the workflow is public, so anyone can verify this APK against the source."
          } >> release-notes.md

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: false
          body_path: release-notes.md
